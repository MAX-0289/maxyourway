name: Publish the studio rate card
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rate-card.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'MAX-0289/maxyourway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the rate page and its PDF together
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          files={'docs/rates.html': ('c162763f022013d24e3dc2720ff8a007f2b4f09cb6cfdd55d774788326dd090e', '917938cd084e34e62faa811f07ea5ca85ef7cd81beae9ed53188d2ff6086c2e1'), 'docs/downloads/maxyourway-rates-zh.pdf': ('300fa6035438c7befed6dab796321919eded24863b21edfe0fb977d86c5b795b', 'eadc0724dd707fdf5818156c05cb7ae6918d4689079b8642257a6ec5b4cf6f26')}
          src=Path('.github/workflows/publish-rate-card.yml').read_text().splitlines()
          data=base64.b64decode(''.join(line[3:] for line in src if line.startswith('#| ')),validate=True)
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(data)=='6e46457343f9c6fed28aaefe89cd340d7fb0f7f9144651f8e9b8db542366c4b4'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert set(z.namelist())==set(files)
              for n,(before,after) in files.items():
                  assert n in ('docs/rates.html','docs/downloads/maxyourway-rates-zh.pdf')
                  path=Path(n);assert sha(path.read_bytes())==before,n
                  content=z.read(n);assert sha(content)==after;path.write_bytes(content)
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/rates.html docs/downloads/maxyourway-rates-zh.pdf
          git diff --cached --check -- docs/rates.html
          git commit -m 'Update commercial photography, social video and event rates'
          git push origin HEAD:main

