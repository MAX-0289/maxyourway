name: Publish MITCO portrait films
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mitco-portraits.yml']
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'MAX-0289/maxyourway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified portrait covers and responsive gallery
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,zipfile,io,json,re,hashlib
          digest=lambda d: hashlib.sha256(d).hexdigest()
          lines=Path('.github/workflows/mitco-portraits.yml').read_text().splitlines()
          data=base64.b64decode(''.join(x[3:] for x in lines if x.startswith('#| ')),validate=True)
          assert digest(data)=='403775d189c54d400fd9e1e21bddd10c6674786146858fd260f666a6362603c9'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              m=json.loads(z.read('manifest.json'))
              for n,(before,after) in m.items():
                  assert n in {'docs/library.css','docs/social.html'} or re.fullmatch(r'docs/assets/social/mitco-[a-z-]+\.webp',n)
                  p=Path(n)
                  assert (digest(p.read_bytes()) if p.exists() else None)==before,n
                  if after:
                      b=z.read(n); assert digest(b)==after; p.write_bytes(b)
                  else: p.unlink()
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- docs
          git diff --cached --check
          git commit -m 'Show five MITCO films as full-frame vertical cards'
          git push origin HEAD:main
      - name: Retire the completed temporary maintenance branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=portfolio-media-cleanup
          current=$(git ls-remote --heads origin refs/heads/$branch | cut -f1)
          if test -z "$current"; then exit 0; fi
          test "$current" = "8e29acfff364be0fd473135833e1aec5c8ecd51b"
          gh api --method DELETE /repos/MAX-0289/maxyourway/git/refs/heads/$branch

