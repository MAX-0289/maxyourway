          def sha(data):return hashlib.sha256(data).hexdigest()
          def download(pair):
           name,checksum=pair;file=out/name
           subprocess.run(['curl','--fail','--silent','--show-error','--retry','5','--retry-all-errors','--max-time','600','--output',str(file),server+'/'+name],check=True)
