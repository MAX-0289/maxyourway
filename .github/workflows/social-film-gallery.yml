           return file
          with ThreadPoolExecutor(max_workers=3) as pool:verified=list(pool.map(download,archives))
          seen=set()
          for name in verified:
           with zipfile.ZipFile(name) as z:
            for path in z.namelist():
             assert path in allowed and path not in seen,path
             assert path.startswith('docs/') and '..' not in Path(path).parts
             target=Path(path); before,after=allowed[path]
             existing=sha(target.read_bytes()) if target.is_file() else None
             assert existing in (before,after),path
             data=z.read(path); assert sha(data)==after,path
             seen.add(path)
             if existing!=after:
