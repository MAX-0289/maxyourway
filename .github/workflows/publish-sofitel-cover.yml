name: Publish the Sofitel cover
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-sofitel-cover.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'MAX-0289/maxyourway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the photography card and its photograph
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          files={'docs/photography.html': ('ebc7a658c8900f02c691c5fc05e9a443f7344ee119621e9ec2c0f46fc1c79101', 'b73bd408fc0051dcb8ff45188da3bc0361e4316fe0a6941775b73ffe94ede3e1'), 'docs/assets/spaces/sofitel-facade.webp': (None, 'd4b2ac1d7906593173c649f4c447c8d08d1a2d619d8c799c49a0636805b8fc1e')}
          src=Path('.github/workflows/publish-sofitel-cover.yml').read_text().splitlines()
          data=base64.b64decode(''.join(line[3:] for line in src if line.startswith('#| ')),validate=True)
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(data)=='5c5ad787cee55777703f5c04c9ec3e32cbe5641ee7270790c84cb0dc0f1552f7'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert set(z.namelist())==set(files)
              for n,(before,after) in files.items():
                  assert n in ('docs/photography.html','docs/assets/spaces/sofitel-facade.webp')
                  path=Path(n);assert (sha(path.read_bytes()) if path.exists() else None)==before,n
                  content=z.read(n);assert sha(content)==after;path.write_bytes(content)
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/photography.html docs/assets/spaces/sofitel-facade.webp
          git diff --cached --check -- docs/photography.html
          git commit -m 'Feature the Sofitel facade on the photography index'
          git push origin HEAD:main

