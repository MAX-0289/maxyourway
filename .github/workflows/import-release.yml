name: Import approved website release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import the website into docs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/index.html ] && [ ! -e release ]; then exit 0; fi
          test ! -e docs
          archive="$RUNNER_TEMP/website.zip"
          for part in release/part-{01,02,03,04}.txt; do base64 --decode "$part"; done > "$archive"
          echo "afcf109d300c5554440c01218ef43d322b15a9e27e852ce7104385b7cf316ea4  $archive" | sha256sum --check
          unzip -q "$archive" -d docs
          test -s docs/index.html
          test -s docs/assets/portfolio/air-macau/lusocasa.mp4
          touch docs/.nojekyll
          git rm -r release
          git add docs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish the MaxYourWay portfolio'
          git push origin HEAD:main
