name: Publish live photography case studies
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-live-albums.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'MAX-0289/maxyourway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish four real event albums with their picture previews
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          allowed={'docs/photography.html': ['c97a70866d3378721d14f47c2be4175c9f9c6aa4908484e4d491e5f4d928b425', 'ebc7a658c8900f02c691c5fc05e9a443f7344ee119621e9ec2c0f46fc1c79101'], 'docs/rates.html': ['917938cd084e34e62faa811f07ea5ca85ef7cd81beae9ed53188d2ff6086c2e1', '959a53bacf96a5563fcbd0a244e72855741094630215ac68adec4a80eb979b65'], 'docs/clients.html': ['974816a2587bb3319a030fb7864cb9059644b1adbd19ff035156437a6a0c4ab2', 'cf3c84b5316ffd50df696b22bb60d7c67bc7e666543e205cff529bbf59c86e5a'], 'docs/live-albums.css': [None, '3435e05905fe5ee519afcdf5e9fc6f3f5741c2dd1e146f62a51cd5fc852c8ca9'], 'docs/downloads/maxyourway-rates-zh.pdf': ['eadc0724dd707fdf5818156c05cb7ae6918d4689079b8642257a6ec5b4cf6f26', '68a138e254737975dddf9e8428041112b353963852b454aae736d6ce03b4cbab'], 'docs/assets/events/live-diasorin-1.webp': [None, 'ad77517cac6a274cbad0eab571d0a6224f0064e325cd6b07b51bc8b51330713b'], 'docs/assets/events/live-diasorin-2.webp': [None, '32c11e86dd8279325a9799c711dacc115feb83dc99636101627a6c34849943b6'], 'docs/assets/events/live-nam-van-1.webp': [None, '90c3b9e00e8f9577a4f30eb9c2359564f93e197831737c2ccd7d0c033d407d86'], 'docs/assets/events/live-nam-van-2.webp': [None, 'a03867e0811438533f415f649853bbd7368e55a3205f154a3fbe939262570873'], 'docs/assets/events/live-tea-forum-1.webp': [None, 'b2d4b4f1e6e6f687ca34d271efd6b89c386c23d694daa69be085d987971a1617'], 'docs/assets/events/live-tea-forum-2.webp': [None, '36af72d5d8ba7d069c4f2b0f910a13bb5c61fc405ef798adecc7b3c3d934cdda'], 'docs/assets/events/live-yutong-1.webp': [None, 'e464f8b8783cb26fe809091921e53c22c1c3412ddf121a1b769e62eb355c6bbc'], 'docs/assets/events/live-yutong-2.webp': [None, '60ec85c22303d3df24aa8c880e3c701754f944242e899a575a2d61e062616007']}
          parts=['gallery-part-1.txt', 'gallery-part-2.txt', 'gallery-part-3.txt', 'gallery-part-4.txt']
          workflow=Path('.github/workflows/publish-live-albums.yml')
          lines=workflow.read_text().splitlines()
          base=''.join(''.join(Path('.github',p).read_text().split()) for p in parts)
          payload=base64.b64decode(base+''.join(line[3:] for line in lines if line.startswith('#| ')),validate=True)
          sha=lambda b: hashlib.sha256(b).hexdigest()
          assert sha(payload)=='d4d7a5c8ed0375ca250d48c2e17f1f3700acdeb5bb282a6093e6f47904847f91'
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              assert set(archive.namelist())==set(allowed)
              for n,(before,after) in allowed.items():
                  target=Path(n); assert n.startswith('docs/') and '..' not in target.parts
                  assert (sha(target.read_bytes()) if target.is_file() else None)==before,n
                  image=archive.read(n);assert sha(image)==after,n
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(image)
          for p in parts: Path('.github',p).unlink()
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- docs .github
          git diff --cached --check -- '*.html' '*.css'
          git commit -m 'Add four live photo albums with event previews and rate card links'
          git push origin HEAD:main


