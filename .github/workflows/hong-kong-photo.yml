name: Update the Hong Kong homepage photo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hong-kong-photo.yml']
permissions:
  contents: write
jobs:
  publish-photo:
    if: github.repository == 'MAX-0289/maxyourway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the two approved crops and update the homepage
        shell: bash
        run: |
          python3 - <<'PHOTO'
          import base64, hashlib, io, zipfile
          from pathlib import Path
          source = Path('release/tram-pictures.txt')
          data = base64.b64decode(''.join(source.read_text().split()), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'bfe5b50e598bbb65e73aa157a6cfb13baea9ddf77e89016a0e346626015c7539'
          with zipfile.ZipFile(io.BytesIO(data)) as images:
              assert set(images.namelist()) == {'hong-kong-tram.webp', 'hong-kong-tram-phone.webp'}
              for name in images.namelist():
                  target = Path('docs/assets') / name
                  assert not target.exists()
                  target.write_bytes(images.read(name))
          page = Path('docs/index.html')
          html = page.read_text()
          assert html.count('assets/hong-kong-street') == 2 and html.count('香港街头横过马路的行人、沿街招牌和的士') == 1
          page.write_text(html.replace('assets/hong-kong-street', 'assets/hong-kong-tram').replace('香港街头横过马路的行人、沿街招牌和的士', '浅蓝色双层电车沿香港街道的轨道驶来'))
          source.unlink()
          PHOTO
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/assets/hong-kong-tram.webp docs/assets/hong-kong-tram-phone.webp docs/index.html release/tram-pictures.txt
          git commit -m 'Feature a Hong Kong double-decker tram in the homepage panorama'
          git push origin HEAD:main
